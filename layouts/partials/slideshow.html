{{ $slides := hugo.Data.slideshow }}
{{ $count := len $slides }}
{{ $duration := 300 }}
{{ $total := mul $count $duration }}

<style>
.slideshow {
  position: relative;
  width: 100%;
  height: 340px;
  overflow: hidden;
  background: #000;
}
.slideshow-slide {
  position: absolute;
  inset: 0;
  opacity: 0;
  animation: slidefade {{ $total }}s infinite;
}
.slideshow-slide img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.slideshow-credit {
  position: absolute;
  bottom: 0.5rem;
  right: 0.75rem;
  font-size: 0.7rem;
  color: rgba(255,255,255,0.75);
}
.slideshow-credit a {
  color: rgba(255,255,255,0.75);
  text-decoration: underline;
}
{{ range $i, $slide := $slides }}
.slideshow-slide:nth-child({{ add $i 1 }}) {
  animation-delay: {{ mul $i $duration }}s;
}
{{ end }}
@keyframes slidefade {
  0%                                    { opacity: 0; }
  5%                                    { opacity: 1; }
  {{ div 100 $count | int }}%          { opacity: 1; }
  {{ add (div 100 $count | int) 5 }}%  { opacity: 0; }
  100%                                  { opacity: 0; }
}
</style>

<div class="slideshow">
  {{ range $slides }}
  {{ $img := resources.Get .image }}
  {{ if $img }}
  <div class="slideshow-slide">
    <img src="{{ $img.RelPermalink }}" alt="{{ .alt }}" loading="eager">
    <div class="slideshow-credit">
      Photo: <a href="{{ .creditUrl }}" target="_blank" rel="noopener">{{ .credit }}</a>
    </div>
  </div>
  {{ end }}
  {{ end }}
</div>
<script>
(function () {
  var total = {{ $total }};
  var offset = Math.random() * total;
  document.querySelectorAll('.slideshow-slide').forEach(function (el) {
    var current = parseFloat(getComputedStyle(el).animationDelay) || 0;
    el.style.animationDelay = (current - offset) + 's';
  });
})();
</script>
